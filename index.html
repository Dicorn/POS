function downloadReceipt(sale) {
  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + sale.receiptNumber + '</title>' +
    '<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,sans-serif;padding:20px;max-width:320px;margin:0 auto}' +
    '.center{text-align:center}.bb{border-bottom:2px dashed #ccc;padding-bottom:12px;margin-bottom:12px}' +
    '.row{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px}' +
    '.total{font-size:20px;font-weight:700}.sm{font-size:11px;color:#666}' +
    '.badge{display:inline-block;padding:4px 14px;border-radius:6px;font-weight:700;font-size:13px;margin-top:10px}' +
    '@media print{body{padding:0}}</style></head><body>' +
    '<div class="center bb"><h2 style="font-size:16px">MI NEGOCIO S.A.C.</h2>' +
    '<p class="sm">RUC: 20123456789</p><p class="sm">Av. Principal 123, Lima</p>' +
    '<p style="font-weight:700;margin-top:8px">' + (sale.receiptType === "boleta" ? "BOLETA DE VENTA" : "NOTA DE VENTA") + '</p>' +
    '<p style="color:#0ea5e9;font-weight:700">' + sale.receiptNumber + '</p></div>' +
    '<div class="bb"><p class="sm">Fecha: ' + sale.date + '</p><p class="sm">Cliente: ' + sale.client.name + '</p></div>' +
    '<div class="bb">' + sale.items.map(function(i) { return '<div class="row"><span>' + i.name + ' ' + (i.type === "weight" ? '(' + i.quantity + 'kg)' : 'x' + i.quantity) + '</span><span style="font-weight:600">S/ ' + i.subtotal.toFixed(2) + '</span></div>'; }).join('') + '</div>' +
    '<div class="row total"><span>TOTAL</span><span>S/ ' + sale.total.toFixed(2) + '</span></div>' +
    (sale.paymentStatus !== "paid" ? '<div class="row" style="color:#ef4444;font-weight:700"><span>PENDIENTE</span><span>S/ ' + sale.pending.toFixed(2) + '</span></div>' : '') +
    '<div class="center"><span class="badge" style="background:' + (sale.paymentStatus === "paid" ? "#dcfce7;color:#16a34a" : sale.paymentStatus === "debt" ? "#fef2f2;color:#ef4444" : "#fffbeb;color:#f59e0b") + '">' + (sale.paymentStatus === "paid" ? "PAGADO" : sale.paymentStatus === "debt" ? "DEUDA" : "PAGO PARCIAL") + '</span></div>' +
    '<script>window.onload=function(){window.print()}<\/script></body></html>';
  var blob = new Blob([html], { type: "text/html" });
  var url = URL.createObjectURL(blob);
  window.open(url, "_blank", "width=400,height=600");
  setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
}

function downloadSalesReport(sales) {
  if (!sales.length) return;
  var today = new Date().toLocaleDateString("es-PE");
  var totalVentas = sales.reduce(function(s, v) { return s + v.total; }, 0);
  var totalPendiente = sales.reduce(function(s, v) { return s + v.pending; }, 0);

  var wb = XLSX.utils.book_new();

  // Hoja 1: Detalle de ventas
  var detailData = [
    ["REPORTE DE VENTAS — " + today],
    [],
    ["Nro. Comprobante", "Fecha", "Cliente", "Tipo", "Estado", "Productos", "Total (S/)", "Pagado (S/)", "Pendiente (S/)"]
  ];
  sales.forEach(function(s) {
    var items = s.items.map(function(i) { return i.name + " (" + i.quantity + ")"; }).join(", ");
    detailData.push([
      s.receiptNumber, s.date, s.client.name,
      s.receiptType === "boleta" ? "Boleta" : "Nota",
      s.paymentStatus === "paid" ? "Pagado" : s.paymentStatus === "debt" ? "Deuda" : "Parcial",
      items, s.total, s.paid, s.pending
    ]);
  });
  detailData.push([]);
  detailData.push(["", "", "", "", "RESUMEN", "", "", "", ""]);
  detailData.push(["", "", "", "", "Total de ventas:", sales.length, "", "", ""]);
  detailData.push(["", "", "", "", "Monto total:", "", totalVentas, "", ""]);
  detailData.push(["", "", "", "", "Monto cobrado:", "", "", totalVentas - totalPendiente, ""]);
  detailData.push(["", "", "", "", "Monto pendiente:", "", "", "", totalPendiente]);

  var ws = XLSX.utils.aoa_to_sheet(detailData);

  // Anchos de columna
  ws["!cols"] = [
    { wch: 18 }, { wch: 20 }, { wch: 20 }, { wch: 10 }, { wch: 14 },
    { wch: 40 }, { wch: 12 }, { wch: 12 }, { wch: 12 }
  ];

  // Merge título
  ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }];

  XLSX.utils.book_append_sheet(wb, ws, "Ventas del Día");

  // Hoja 2: Detalle por producto
  var productMap = {};
  sales.forEach(function(s) {
    s.items.forEach(function(item) {
      if (!productMap[item.name]) productMap[item.name] = { qty: 0, total: 0 };
      productMap[item.name].qty += item.quantity;
      productMap[item.name].total += item.subtotal;
    });
  });
  var prodData = [["Producto", "Cantidad vendida", "Total (S/)"]];
  Object.keys(productMap).forEach(function(name) {
    prodData.push([name, productMap[name].qty, productMap[name].total]);
  });
  var ws2 = XLSX.utils.aoa_to_sheet(prodData);
  ws2["!cols"] = [{ wch: 30 }, { wch: 18 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Por Producto");

  XLSX.writeFile(wb, "ventas_" + today.replace(/\//g, "-") + ".xlsx");
}

const S = {
  bg: "#f0f2f5", card: "#ffffff", border: "#e5e7eb", borderLight: "#f3f4f6",
  text: "#1a1a2e", textMuted: "#6b7280", textLight: "#9ca3af",
  accent: "#0ea5e9", accentDark: "#0284c7",
  accentBg: "rgba(14,165,233,0.08)", accentBorder: "rgba(14,165,233,0.2)",
  green: "#10b981", greenBg: "rgba(16,185,129,0.08)", greenBorder: "rgba(16,185,129,0.2)",
  red: "#ef4444", redBg: "rgba(239,68,68,0.06)", redBorder: "rgba(239,68,68,0.15)",
  amber: "#f59e0b", amberBg: "rgba(245,158,11,0.08)",
  purple: "#8b5cf6", purpleBg: "rgba(139,92,246,0.06)",
  radius: 12, radiusSm: 8,
  shadow: "0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06)",
  shadowLg: "0 10px 40px rgba(0,0,0,0.08)",
  mono: "'JetBrains Mono', monospace", font: "'Plus Jakarta Sans', sans-serif",
};

const inputBase = { width: "100%", padding: "10px 14px", borderRadius: S.radiusSm, border: "1.5px solid " + S.border, background: "#fff", color: S.text, fontSize: 13, fontFamily: S.font, transition: "all 0.15s" };
const inputMono = { ...inputBase, fontFamily: S.mono };

function POS() {
  const [products, setProducts] = useState(INITIAL_PRODUCTS);
  const [cart, setCart] = useState([]);
  const [search, setSearch] = useState("");
  const [category, setCategory] = useState("Todos");
  const [showPayment, setShowPayment] = useState(false);
  const [paymentStatus, setPaymentStatus] = useState("paid");
  const [partialAmount, setPartialAmount] = useState("");
  const [receiptType, setReceiptType] = useState("boleta");
  const [selectedClient, setSelectedClient] = useState(null);
  const [wantsRegister, setWantsRegister] = useState(null);
  const [clientSearch, setClientSearch] = useState("");
  const [alerts, setAlerts] = useState([]);
  const [showReceipt, setShowReceipt] = useState(false);
  const [lastSale, setLastSale] = useState(null);
  const [weightInput, setWeightInput] = useState({});
  const [isAdmin, setIsAdmin] = useState(true);
  const [showSales, setShowSales] = useState(false);
  const [salesHistory, setSalesHistory] = useState([]);
  const [showProductPanel, setShowProductPanel] = useState(false);
  const [newProduct, setNewProduct] = useState({ name: "", code: "", category: "Abarrotes", type: "quantity", price: "", cost: "", stock: "", minStock: "", image: "" });
  const [productSuccess, setProductSuccess] = useState(null);
  const [editingProduct, setEditingProduct] = useState(null);
  const searchRef = useRef(null);

  const allCategories = useMemo(() => [...new Set(["Todos", ...products.map(p => p.category)])], [products]);

  const filteredProducts = products.filter(p => {
    const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.code.includes(search);
    const matchCat = category === "Todos" || p.category === category;
    return matchSearch && matchCat;
  });

  const addToCart = (product, qty = null) => {
    if (product.stock <= 0) {
      setAlerts(prev => [...prev, { id: Date.now(), product: product.name, remaining: 0, outOfStock: true }]);
      setTimeout(() => setAlerts(prev => prev.slice(1)), 3000);
      return;
    }
    if (product.type === "weight" && !qty) { setWeightInput(prev => ({ ...prev, [product.id]: true })); return; }
    const quantity = qty || 1;
    const existing = cart.find(item => item.id === product.id);
    const alreadyInCart = existing ? existing.quantity : 0;
    if (alreadyInCart + quantity > product.stock) {
      setAlerts(prev => [...prev, { id: Date.now(), product: product.name, remaining: product.stock, exceeded: true }]);
      setTimeout(() => setAlerts(prev => prev.slice(1)), 3000);
      return;
    }
    let newCart;
    if (existing && product.type === "quantity") {
      newCart = cart.map(item => item.id === product.id ? { ...item, quantity: item.quantity + quantity } : item);
    } else {
      newCart = [...cart, { ...product, quantity, subtotal: +(product.price * quantity).toFixed(2) }];
    }
    newCart = newCart.map(item => ({ ...item, subtotal: +(item.price * item.quantity).toFixed(2) }));
    setCart(newCart);
    if (product.stock - (alreadyInCart + quantity) <= product.minStock) {
      setAlerts(prev => [...prev, { id: Date.now(), product: product.name, remaining: Math.max(0, product.stock - alreadyInCart - quantity) }]);
      setTimeout(() => setAlerts(prev => prev.slice(1)), 4000);
    }
    setWeightInput(prev => ({ ...prev, [product.id]: false }));
  };

  const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));
  const updateQty = (id, qty) => {
    if (qty <= 0) return removeFromCart(id);
    const product = products.find(p => p.id === id);
    if (product && qty > product.stock) return;
    setCart(cart.map(item => item.id === id ? { ...item, quantity: qty, subtotal: +(item.price * qty).toFixed(2) } : item));
  };
  const total = cart.reduce((sum, item) => sum + item.subtotal, 0);
  const totalCost = cart.reduce((sum, item) => sum + (item.cost * item.quantity), 0);
  const margin = total - totalCost;
  const marginPct = total > 0 ? ((margin / total) * 100).toFixed(1) : 0;

  const completeSale = () => {
    const sale = {
      id: Date.now(), date: new Date().toLocaleString("es-PE"), items: [...cart], total,
      client: selectedClient || { name: "Consumidor Final" }, receiptType, paymentStatus,
      paid: paymentStatus === "paid" ? total : paymentStatus === "partial" ? parseFloat(partialAmount) || 0 : 0,
      pending: paymentStatus === "paid" ? 0 : paymentStatus === "partial" ? total - (parseFloat(partialAmount) || 0) : total,
      receiptNumber: receiptType === "boleta" ? "BV-" + String(salesHistory.length + 1).padStart(4, "0") : "NV-" + String(salesHistory.length + 1).padStart(4, "0")
    };
    setLastSale(sale); setSalesHistory(prev => [sale, ...prev]); setShowReceipt(true); setShowPayment(false);
    setProducts(prev => prev.map(p => {
      const sold = cart.find(item => item.id === p.id);
      return sold ? { ...p, stock: Math.max(0, +(p.stock - sold.quantity).toFixed(3)) } : p;
    }));
    setCart([]); setSelectedClient(null); setWantsRegister(null); setPaymentStatus("paid"); setPartialAmount("");
  };

  const filteredClients = CLIENTS.filter(c => c.name.toLowerCase().includes(clientSearch.toLowerCase()) || c.dni.includes(clientSearch));

  const addNewProduct = () => {
    if (!newProduct.name || !newProduct.price || !newProduct.stock) return;
    const p = { id: Date.now(), name: newProduct.name, code: newProduct.code || String(Date.now()).slice(-13), category: newProduct.category, type: newProduct.type, price: parseFloat(newProduct.price), cost: parseFloat(newProduct.cost) || 0, stock: parseFloat(newProduct.stock), minStock: parseFloat(newProduct.minStock) || 5, unit: newProduct.type === "weight" ? "kg" : "un.", image: newProduct.image || "", emoji: CATEGORY_EMOJI[newProduct.category] || "🏷️" };
    setProducts(prev => [...prev, p]);
    setNewProduct({ name: "", code: "", category: "Abarrotes", type: "quantity", price: "", cost: "", stock: "", minStock: "", image: "" });
    setProductSuccess('"' + p.name + '" agregado'); setTimeout(() => setProductSuccess(null), 3000);
  };

  const deleteProduct = (id) => { setProducts(prev => prev.filter(p => p.id !== id)); setCart(prev => prev.filter(item => item.id !== id)); };
  const startEditProduct = (p) => setEditingProduct({ ...p, price: String(p.price), cost: String(p.cost), stock: String(p.stock), minStock: String(p.minStock), image: p.image || "" });
  const saveEditProduct = () => {
    if (!editingProduct) return;
    setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...editingProduct, price: parseFloat(editingProduct.price), cost: parseFloat(editingProduct.cost) || 0, stock: parseFloat(editingProduct.stock), minStock: parseFloat(editingProduct.minStock) || 5, unit: editingProduct.type === "weight" ? "kg" : "un.", image: editingProduct.image || "", emoji: editingProduct.emoji || CATEGORY_EMOJI[editingProduct.category] || "🏷️" } : p));
    setProductSuccess('"' + editingProduct.name + '" actualizado'); setEditingProduct(null); setTimeout(() => setProductSuccess(null), 3000);
  };

  const statusLabel = { paid: "Pagado", debt: "Deuda", partial: "Parcial" };
  const statusColor = { paid: S.green, debt: S.red, partial: S.amber };
  const statusBg = { paid: S.greenBg, debt: S.redBg, partial: S.amberBg };
  const todaySalesTotal = salesHistory.reduce((s, v) => s + v.total, 0);

  return (
    <div style={{ fontFamily: S.font, background: S.bg, color: S.text, minHeight: "100vh", display: "flex", flexDirection: "column" }}>

      {/* HEADER */}
      <header style={{ background: "#fff", borderBottom: "1.5px solid " + S.border, padding: "0 24px", height: 60, display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 50, boxShadow: "0 1px 3px rgba(0,0,0,0.03)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 34, height: 34, borderRadius: 10, background: "linear-gradient(135deg, " + S.accent + ", #06b6d4)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 15, fontWeight: 800 }}>V</div>
          <div>
            <div style={{ fontSize: 15, fontWeight: 800, letterSpacing: "-0.03em" }}>VentaFácil</div>
            <div style={{ fontSize: 10, color: S.textLight, fontWeight: 500, letterSpacing: "0.05em", textTransform: "uppercase" }}>Sistema POS</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => setShowProductPanel(true)} style={{ padding: "7px 14px", borderRadius: S.radiusSm, border: "1.5px solid " + S.border, background: "#fff", color: S.textMuted, cursor: "pointer", fontSize: 12, fontWeight: 600, fontFamily: S.font, display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 14 }}>📦</span> Productos <span style={{ background: S.accentBg, color: S.accent, padding: "1px 7px", borderRadius: 20, fontSize: 11, fontWeight: 700 }}>{products.length}</span>
          </button>
          <button onClick={() => setShowSales(!showSales)} style={{ padding: "7px 14px", borderRadius: S.radiusSm, border: showSales ? "1.5px solid " + S.accent : "1.5px solid " + S.border, background: showSales ? S.accentBg : "#fff", color: showSales ? S.accent : S.textMuted, cursor: "pointer", fontSize: 12, fontWeight: 600, fontFamily: S.font, display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 14 }}>📊</span> Ventas <span style={{ background: showSales ? "rgba(14,165,233,0.15)" : S.borderLight, color: showSales ? S.accent : S.textLight, padding: "1px 7px", borderRadius: 20, fontSize: 11, fontWeight: 700 }}>{salesHistory.length}</span>
          </button>
          <div style={{ width: 1, height: 24, background: S.border, margin: "0 4px" }} />
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", borderRadius: S.radiusSm, background: isAdmin ? S.purpleBg : S.accentBg, border: "1.5px solid " + (isAdmin ? "rgba(139,92,246,0.15)" : S.accentBorder) }}>
            <div style={{ width: 7, height: 7, borderRadius: "50%", background: isAdmin ? S.purple : S.accent }} />
            <span style={{ fontSize: 12, fontWeight: 600, color: isAdmin ? S.purple : S.accent }}>{isAdmin ? "Admin" : "Vendedor"}</span>
            <button onClick={() => setIsAdmin(!isAdmin)} style={{ padding: "2px 8px", borderRadius: 4, border: "1px solid " + S.border, background: "#fff", color: S.textLight, cursor: "pointer", fontSize: 10, fontFamily: S.font }}>↔</button>
          </div>
        </div>
      </header>

      {/* ALERTS */}
      <div style={{ position: "fixed", top: 70, right: 20, zIndex: 1000, display: "flex", flexDirection: "column", gap: 8 }}>
        {alerts.map(a => (
          <div key={a.id} style={{ background: "#fff", border: "1.5px solid " + (a.outOfStock ? S.redBorder : a.exceeded ? "rgba(245,158,11,0.3)" : S.redBorder), borderRadius: S.radius, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, animation: "popIn 0.25s ease", boxShadow: S.shadowLg, minWidth: 280 }}>
            <div style={{ width: 36, height: 36, borderRadius: 10, background: a.outOfStock ? S.redBg : a.exceeded ? S.amberBg : S.redBg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>{a.outOfStock ? "🚫" : a.exceeded ? "📦" : "⚠️"}</div>
            <div>

                    <div style={{ fontSize: 12, color: S.textMuted, marginBottom: 3 }}>{s.client.name}</div>

                      <span style={{ fontSize: 12, color: S.purple, fontWeight: 600 }}>Margen: S/{margin.toFixed(2)}</span>

                    </div>
                  )}

                    <span style={{ fontSize: 14, fontWeight: 600, color: S.textMuted }}>TOTAL</span>

                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                        <label style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "12px 14px", borderRadius: S.radiusSm, border: "1.5px dashed " + (fd.image ? S.green : S.border), background: fd.image ? S.greenBg : "#fff", cursor: "pointer", fontSize: 12, fontWeight: 600, color: fd.image ? S.green : S.textLight, transition: "all 0.15s" }}>
                          {fd.image ? "✅ Imagen cargada" : "📷 Subir imagen"}

                            const file = e.target.files[0];
                            if (!file) return;
                            if (file.size > 2 * 1024 * 1024) { alert("Imagen muy grande (máx 2MB)"); return; }
                            const reader = new FileReader();
                            reader.onload = (ev) => setFd({ image: ev.target.result });
                            reader.readAsDataURL(file);
                          }} />
                        </label>
                        {fd.image && (
                          <div style={{ position: "relative", width: 52, height: 52, borderRadius: S.radiusSm, overflow: "hidden", border: "1.5px solid " + S.border, flexShrink: 0 }}>
                            <img src={fd.image} alt="Preview" style={{ width: "100%", height: "100%", objectFit: "cover" }} />

                          </div>

                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                        <input value={fd.stock} onChange={e => setFd({ stock: e.target.value })} type="number" step="0.01" placeholder="Stock actual *" style={inputMono} />
                        <input value={fd.minStock} onChange={e => setFd({ minStock: e.target.value })} type="number" placeholder="Stock mín." style={inputMono} />
                      </div>

                        <button onClick={editingProduct ? saveEditProduct : addNewProduct} disabled={!fd.name || !fd.price || !fd.stock} style={{ flex: 1, padding: "11px", borderRadius: S.radiusSm, border: "none", background: (!fd.name || !fd.price || !fd.stock) ? S.border : editingProduct ? "linear-gradient(135deg, " + S.amber + ", #d97706)" : "linear-gradient(135deg, " + S.green + ", #059669)", color: (!fd.name || !fd.price || !fd.stock) ? S.textLight : "#fff", fontSize: 13, fontWeight: 700, cursor: (!fd.name || !fd.price || !fd.stock) ? "not-allowed" : "pointer", fontFamily: S.font }}>{editingProduct ? "💾 Guardar" : "➕ Agregar"}</button>
                      </div>

                    <div style={{ fontSize: 11, color: S.textLight }}>{p.category} · {p.stock} {p.unit}</div>
                  </div>
                  <span style={{ fontSize: 13, fontWeight: 700, color: S.accent, fontFamily: S.mono, whiteSpace: "nowrap" }}>S/{p.price.toFixed(2)}</span>
                  <button onClick={() => startEditProduct(p)} style={{ padding: "5px 8px", borderRadius: 6, border: "1px solid " + S.border, background: "#fff", color: S.textLight, cursor: "pointer", fontSize: 11, fontFamily: S.font }}>✏️</button>
                  <button onClick={() => deleteProduct(p.id)} style={{ padding: "5px 8px", borderRadius: 6, border: "1px solid " + S.redBorder, background: S.redBg, color: S.red, cursor: "pointer", fontSize: 11, fontFamily: S.font }}>🗑️</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* PAYMENT MODAL */}
      {showPayment && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.3)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, backdropFilter: "blur(4px)" }}>
          <div style={{ background: "#fff", borderRadius: 20, width: 420, maxHeight: "90vh", overflowY: "auto", padding: 28, boxShadow: "0 24px 64px rgba(0,0,0,0.12)", animation: "popIn 0.25s ease" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div style={{ fontSize: 20, fontWeight: 800 }}>Finalizar Venta</div>
              <button onClick={() => setShowPayment(false)} style={{ background: S.bg, border: "none", width: 34, height: 34, borderRadius: 8, color: S.textMuted, cursor: "pointer", fontSize: 18 }}>✕</button>
            </div>
            <div style={{ textAlign: "center", padding: "20px 0", marginBottom: 20, background: S.bg, borderRadius: S.radius }}>
              <div style={{ fontSize: 12, color: S.textLight, marginBottom: 4, fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase" }}>Total a cobrar</div>
              <div style={{ fontSize: 38, fontWeight: 800, fontFamily: S.mono, color: S.accent }}>S/{total.toFixed(2)}</div>
            </div>
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: S.textMuted, marginBottom: 8 }}>Cliente</div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => { setWantsRegister(true); setSelectedClient(null); }} style={{ flex: 1, padding: "10px", borderRadius: S.radiusSm, border: wantsRegister === true ? "2px solid " + S.accent : "1.5px solid " + S.border, background: wantsRegister === true ? S.accentBg : "#fff", color: wantsRegister === true ? S.accent : S.textMuted, cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: S.font }}>Registrar</button>
                <button onClick={() => { setWantsRegister(false); setSelectedClient(null); }} style={{ flex: 1, padding: "10px", borderRadius: S.radiusSm, border: wantsRegister === false ? "2px solid " + S.accent : "1.5px solid " + S.border, background: wantsRegister === false ? S.accentBg : "#fff", color: wantsRegister === false ? S.accent : S.textMuted, cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: S.font }}>Consumidor Final</button>
              </div>
              {wantsRegister && (
                <div style={{ marginTop: 10 }}>
                  <input value={clientSearch} onChange={e => setClientSearch(e.target.value)} placeholder="Buscar por nombre o DNI..." style={inputBase} />
                  <div style={{ maxHeight: 110, overflowY: "auto", marginTop: 6 }}>
                    {filteredClients.map(c => (
                      <button key={c.id} onClick={() => { setSelectedClient(c); setClientSearch(""); }} style={{ width: "100%", padding: "8px 12px", borderRadius: 6, border: selectedClient?.id === c.id ? "1.5px solid " + S.accent : "1px solid transparent", background: selectedClient?.id === c.id ? S.accentBg : "transparent", color: S.text, cursor: "pointer", fontSize: 12, textAlign: "left", fontFamily: S.font, display: "flex", justifyContent: "space-between", marginBottom: 2 }}>
                        <span>{c.name} <span style={{ color: S.textLight }}>({c.dni})</span></span>
                        {c.balance > 0 && <span style={{ color: S.red, fontWeight: 700 }}>Debe S/{c.balance.toFixed(2)}</span>}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: S.textMuted, marginBottom: 8 }}>Comprobante</div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setReceiptType("boleta")} style={{ flex: 1, padding: "10px", borderRadius: S.radiusSm, border: receiptType === "boleta" ? "2px solid " + S.accent : "1.5px solid " + S.border, background: receiptType === "boleta" ? S.accentBg : "#fff", color: receiptType === "boleta" ? S.accent : S.textMuted, cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: S.font }}>🧾 Boleta</button>
                <button onClick={() => setReceiptType("nota")} style={{ flex: 1, padding: "10px", borderRadius: S.radiusSm, border: receiptType === "nota" ? "2px solid " + S.accent : "1.5px solid " + S.border, background: receiptType === "nota" ? S.accentBg : "#fff", color: receiptType === "nota" ? S.accent : S.textMuted, cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: S.font }}>📝 Nota</button>
              </div>
            </div>
            <div style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: S.textMuted, marginBottom: 8 }}>Estado de pago</div>
              <div style={{ display: "flex", gap: 8 }}>
                {[{ key: "paid", label: "Pagado", icon: "✅" }, { key: "debt", label: "Deuda", icon: "🔴" }, { key: "partial", label: "Parcial", icon: "🟡" }].map(s => (
                  <button key={s.key} onClick={() => setPaymentStatus(s.key)} style={{ flex: 1, padding: "10px", borderRadius: S.radiusSm, border: paymentStatus === s.key ? "2px solid " + statusColor[s.key] : "1.5px solid " + S.border, background: paymentStatus === s.key ? statusBg[s.key] : "#fff", color: paymentStatus === s.key ? statusColor[s.key] : S.textMuted, cursor: "pointer", fontSize: 12, fontWeight: 600, fontFamily: S.font }}>{s.icon} {s.label}</button>
                ))}
              </div>
              {paymentStatus === "partial" && (
                <div style={{ marginTop: 10 }}>
                  <input type="number" value={partialAmount} onChange={e => setPartialAmount(e.target.value)} placeholder="Monto pagado..." style={{ ...inputMono, border: "2px solid " + S.amber, color: S.amber, textAlign: "center", fontSize: 18 }} />
                  {partialAmount && <div style={{ textAlign: "center", marginTop: 6, fontSize: 12, color: S.red, fontWeight: 600 }}>Pendiente: S/{(total - parseFloat(partialAmount || 0)).toFixed(2)}</div>}
                </div>
              )}
              {(paymentStatus === "debt" || paymentStatus === "partial") && !selectedClient && wantsRegister !== true && (
                <div style={{ marginTop: 10, padding: "10px 14px", borderRadius: S.radiusSm, background: S.redBg, border: "1.5px solid " + S.redBorder, fontSize: 12, color: S.red, fontWeight: 600, animation: "shake 0.3s ease" }}>⚠️ Para deudas es obligatorio registrar al cliente</div>
              )}
            </div>
            <button onClick={completeSale} disabled={(paymentStatus !== "paid" && !selectedClient && wantsRegister !== true)} style={{ width: "100%", padding: "15px", borderRadius: S.radius, border: "none", background: (paymentStatus !== "paid" && !selectedClient && wantsRegister !== true) ? S.border : "linear-gradient(135deg, " + S.green + ", #059669)", color: (paymentStatus !== "paid" && !selectedClient && wantsRegister !== true) ? S.textLight : "#fff", fontSize: 15, fontWeight: 700, cursor: (paymentStatus !== "paid" && !selectedClient && wantsRegister !== true) ? "not-allowed" : "pointer", fontFamily: S.font, boxShadow: (paymentStatus !== "paid" && !selectedClient && wantsRegister !== true) ? "none" : "0 4px 14px rgba(16,185,129,0.25)" }}>Confirmar Venta ✓</button>
          </div>
        </div>
      )}

      {/* RECEIPT MODAL */}
      {showReceipt && lastSale && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.3)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, backdropFilter: "blur(4px)" }}>
          <div style={{ background: "#fff", borderRadius: 20, width: 360, padding: 28, boxShadow: "0 24px 64px rgba(0,0,0,0.12)", animation: "popIn 0.3s ease" }}>
            <div style={{ textAlign: "center", borderBottom: "2px dashed " + S.border, paddingBottom: 16, marginBottom: 16 }}>
              <div style={{ fontSize: 17, fontWeight: 800 }}>MI NEGOCIO S.A.C.</div>
              <div style={{ fontSize: 11, color: S.textLight }}>RUC: 20123456789</div>
              <div style={{ fontSize: 11, color: S.textLight }}>Av. Principal 123, Lima</div>
              <div style={{ fontSize: 14, fontWeight: 700, marginTop: 10 }}>{lastSale.receiptType === "boleta" ? "BOLETA DE VENTA" : "NOTA DE VENTA"}</div>
              <div style={{ fontSize: 13, color: S.accent, fontWeight: 700, fontFamily: S.mono }}>{lastSale.receiptNumber}</div>
            </div>
            <div style={{ fontSize: 12, color: S.textMuted, marginBottom: 12 }}>
              <div>Fecha: {lastSale.date}</div>
              <div>Cliente: {lastSale.client.name}</div>
            </div>
            <div style={{ borderBottom: "1px dashed " + S.border, paddingBottom: 12, marginBottom: 12 }}>
              {lastSale.items.map(item => (
                <div key={item.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 5 }}>
                  <span>{item.name} {item.type === "weight" ? "(" + item.quantity + "kg)" : "x" + item.quantity}</span>
                  <span style={{ fontWeight: 600, fontFamily: S.mono }}>S/{item.subtotal.toFixed(2)}</span>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 20, fontWeight: 800, marginBottom: 6 }}>
              <span>TOTAL</span>
              <span style={{ fontFamily: S.mono }}>S/{lastSale.total.toFixed(2)}</span>
            </div>
            {lastSale.paymentStatus !== "paid" && (
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: S.red, fontWeight: 700 }}>
                <span>PENDIENTE</span>
                <span>S/{lastSale.pending.toFixed(2)}</span>
              </div>
            )}
            <div style={{ textAlign: "center", marginTop: 14, padding: "8px", borderRadius: S.radiusSm, background: statusBg[lastSale.paymentStatus], color: statusColor[lastSale.paymentStatus], fontWeight: 700, fontSize: 13 }}>{statusLabel[lastSale.paymentStatus]}</div>
            <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
              <button onClick={() => setShowReceipt(false)} style={{ flex: 1, padding: "11px", borderRadius: S.radiusSm, border: "1.5px solid " + S.border, background: "#fff", color: S.textMuted, cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: S.font }}>Cerrar</button>
              <button onClick={() => downloadReceipt(lastSale)} style={{ flex: 1, padding: "11px", borderRadius: S.radiusSm, border: "none", background: "linear-gradient(135deg, " + S.accent + ", " + S.accentDark + ")", color: "#fff", cursor: "pointer", fontSize: 13, fontWeight: 700, fontFamily: S.font, boxShadow: "0 2px 8px rgba(14,165,233,0.2)" }}>🖨️ Descargar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<POS />);
  </script>
</body>
</html>
